name: Build Iris

on:
  workflow_dispatch:

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Iris
        uses: actions/checkout@v4
        with:
          repository: VolmitSoftware/Iris
          ref: 4.1.1-26.1.2-26.2
          path: Iris

      - name: Checkout VolmLib at pinned commit
        uses: actions/checkout@v4
        with:
          repository: VolmitSoftware/VolmLib
          ref: 6c54bbcd19282508364794df1eacb9720d94a896
          path: VolmLib

      - name: Java 25 setup
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x Iris/gradlew

      - name: Build all platforms
        working-directory: Iris
        env:
          VOLMLIB_DIR: ${{ github.workspace }}/VolmLib
        run: ./gradlew buildAllToOut --no-parallel -PuseLocalVolmLib=true --scan

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: iris-jars
          path: Iris/out/**/*.jar
